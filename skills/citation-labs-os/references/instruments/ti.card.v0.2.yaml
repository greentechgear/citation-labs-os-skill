vocabulary:
  in_prompt_text:
  - situation record with version label (SYNTHETIC_ASTERON_v1.0)
  - role/responsibility clause (the manipulated variable)
  - evidence request (constant across a comparison)
  - governing regime, when leaving it unnamed would let the model pick one
  in_instrument_fields:
  - model, effort, profile, runs (run_compare params)
  - label (free text on the job — the one human-readable batch name)
  analyst_owned:
  - role names assigned to run_ids (OT_SEC, IMPL_ENG, CFO, NEUTRAL…)
  - record IDs for the investigation (PRODX_R3_4C_B1, RKD_V1_B1)
  - counting unit and normalization rule (URL / normalized URL / domain / publisher family)
  - evidence states; the SURFACED / RETRIEVED / READ / CITED distinction as applied
consequences:
- op: run_compare
  effect: submits prompts × runs × model; creates permanent run records
  reversible: 'no'
  billable: 'yes'
  confirm_flag: null
  note: Approve the exact execution and spending plan. Confirm current batch cap. Set repetition count explicitly;
    six is the historical reported default.
